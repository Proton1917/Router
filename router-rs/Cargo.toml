[package]
name = "router"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
blake3 = "1.8"
bytes = "1.11"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.3"
memchr = "2.7"
minijinja = { version = "2.12", features = ["json"] }
notify = "8.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
struson = { version = "0.7.2", features = ["serde"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
