[package]
name = "router"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.11"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "process"] }
